# nano-zyrkel: Codex LLM Template (mit ChatGPT Plus/Pro Account)
# Fuer: Intelligente Analyse, natuerlichsprachige Bedingungen, LLM-Auswertung
name: "nano-zyrkel: {{DESCRIPTION}}"

on:
  schedule:
    - cron: '0 7 * * 1,5'   # Anpassen: z.B. Mo+Fr morgens
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + auth Codex CLI
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
        run: |
          npm install -g @openai/codex
          mkdir -p ~/.codex
          echo "$CODEX_AUTH" > ~/.codex/auth.json

      - name: Get nano-zyrkel
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release download -R schlein-lab/nano-zyrkel -p "nano-zyrkel-linux" --clobber
          chmod +x nano-zyrkel-linux
          mv nano-zyrkel-linux nano-zyrkel

      - name: Execute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./nano-zyrkel --config hats/config.json --lang de

      - name: Commit
        run: |
          git config user.name "nano-zyrkel"
          git config user.email "nano@zyrkel.local"
          git add staging/
          git diff --staged --quiet || \
            git commit -m "{{NANO_ID}} $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
