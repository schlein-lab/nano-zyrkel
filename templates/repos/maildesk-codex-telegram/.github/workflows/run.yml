name: "nano-zyrkel: {{DESCRIPTION}}"

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + auth Codex CLI
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
        run: |
          npm install -g @openai/codex
          mkdir -p ~/.codex
          echo "$CODEX_AUTH" > ~/.codex/auth.json

      - name: Run maildesk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          chmod +x scripts/maildesk.sh
          bash scripts/maildesk.sh hats/config.json

      - name: Commit state
        run: |
          git config user.name "nano-zyrkel"
          git config user.email "nano@zyrkel.local"
          git add staging/
          git diff --staged --quiet || \
            git commit -m "{{NANO_ID}} $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
