<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nano-zyrkel — minimal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>{{NANO_ID}}</h1>
  <p class="muted">{{DESCRIPTION}}</p>
  <hr>

  <h2>Status</h2>
  <dl id="status">
    <!-- key/value rendered by app.js -->
  </dl>

  <h2>Latest events</h2>
  <table id="events">
    <thead><tr><th>When</th><th>What</th></tr></thead>
    <tbody></tbody>
  </table>

  <footer>powered by <a href="https://github.com/schlein-lab/nano-zyrkel">nano-zyrkel</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
