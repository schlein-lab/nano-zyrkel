<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nano-zyrkel — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>{{NANO_ID}}</h1>
  <p class="subtitle mono">{{DESCRIPTION}}</p>

  <section class="grid">
    <div class="panel col-3" id="stat-1"></div>
    <div class="panel col-3" id="stat-2"></div>
    <div class="panel col-3" id="stat-3"></div>
    <div class="panel col-3" id="stat-4"></div>

    <div class="panel col-6"><h2>Trend</h2><div id="chart-trend"></div></div>
    <div class="panel col-6"><h2>Distribution</h2><div id="chart-dist"></div></div>

    <div class="panel col-12"><h2>Latest events</h2><div id="event-table"></div></div>
  </section>

  <footer>powered by <a href="https://github.com/schlein-lab/nano-zyrkel">nano-zyrkel</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
