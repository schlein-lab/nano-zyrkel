<!DOCTYPE html>
<!--
  Example: Kaplan-Meier survival curve
  ------------------------------------
  Reads a list of `{ time, event }` records, computes the
  Kaplan-Meier estimator on the JS side and renders the resulting
  step function as a LineChart. The vertical drops are simulated
  with intermediate points so the LineChart can stay generic.

  Adapt to your own dataset by replacing the `events` array.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example — Survival curve</title>
<style>
  body { font: 14px/1.55 'Inter', system-ui, sans-serif; padding: 2rem; max-width: 900px; margin: 0 auto; }
  .card { border: 1px solid #E5E7EB; border-radius: 10px; padding: 1rem; }
  .meta { color: #6B7280; font-size: 0.8125rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<h1>Survival curve</h1>

<div class="card">
  <canvas id="km"></canvas>
  <p class="meta" id="summary"></p>
</div>

<script type="module">
import init, {
  install_panic_hook,
  ChartCanvas, Padding, Scale, draw_y_grid, draw_x_axis,
  LineChart, Format,
} from '../../core/wasm/profile/nano_zyrkel_wasm_core.js';

await init();
install_panic_hook();

// Replace with your own (time, event) records.
// `event = 1` means the subject experienced the event at this time;
// `event = 0` means the subject was censored.
const records = [
  { time:  2, event: 1 },
  { time:  4, event: 1 },
  { time:  5, event: 0 },
  { time:  7, event: 1 },
  { time: 10, event: 1 },
  { time: 12, event: 0 },
  { time: 13, event: 1 },
  { time: 16, event: 1 },
  { time: 18, event: 0 },
  { time: 22, event: 1 },
  { time: 24, event: 0 },
];

// Kaplan-Meier estimator with step output.
function kaplanMeier(rec) {
  const sorted = [...rec].sort((a, b) => a.time - b.time);
  let n = sorted.length;
  let s = 1;
  const points = [{ x: 0, y: 1 }];
  let i = 0;
  while (i < sorted.length) {
    const t = sorted[i].time;
    let d = 0;
    let c = 0;
    while (i < sorted.length && sorted[i].time === t) {
      if (sorted[i].event === 1) d++;
      else c++;
      i++;
    }
    if (d > 0) {
      points.push({ x: t, y: s }); // horizontal lead-in to the drop
      s = s * (1 - d / n);
      points.push({ x: t, y: s }); // drop
    }
    n -= d + c;
  }
  return points;
}

const points = kaplanMeier(records);
const tMax = Math.max(...records.map(r => r.time));

const canvas = new ChartCanvas(document.getElementById('km'), 240, new Padding(40, 12, 12, 28));
const xs = Scale.linear(0, tMax, canvas.plotLeft(), canvas.plotLeft() + canvas.plotWidth());
const ys = Scale.linear(0, 1, canvas.plotTop() + canvas.plotHeight(), canvas.plotTop());

draw_y_grid(canvas, ys, 5, v => Format.percent(v, 0));
draw_x_axis(canvas, xs, 6, v => `${Math.round(v)}`);

new LineChart(canvas)
  .x(xs).y(ys)
  .data(points)
  .stroke('#8B5CF6', 2)
  .draw();

const events = records.filter(r => r.event === 1).length;
const censored = records.length - events;
document.getElementById('summary').textContent =
  `${events} events / ${censored} censored / ${records.length} total subjects.`;
</script>
</body>
</html>
