[package]
name = "example-plugin"
version = "0.1.0"
edition = "2021"
description = "Worked example: implement the Plugin trait against nano-zyrkel-core."

[[bin]]
name = "example-plugin"
path = "src/main.rs"

[dependencies]
# In a real user repo this would be a git dep:
#   nano-zyrkel-core = { git = "https://github.com/schlein-lab/nano-zyrkel", tag = "bin-v0.2.0" }
# For the example we resolve it via the central workspace.
nano-zyrkel-core = { path = "../../../crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
