<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nano-zyrkel studio</title>
  <meta name="description" content="Chat-first Builder fuer nano-zyrkel Projekte">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span class="header-mark">&#x2B21;</span>
    <span class="header-title">nano-zyrkel studio</span>
  </div>
  <div class="header-right">
    <div class="header-dropdown" id="theme-dropdown">
      <button class="btn-dropdown" id="btn-theme">Theme: Dashboard <span class="chevron">&#x25BE;</span></button>
      <div class="dropdown-menu" id="theme-menu"></div>
    </div>
    <div class="zyrkel-status" id="zyrkel-status" title="Zyrkel nicht verbunden">
      <span class="status-dot offline"></span>
      <span class="status-label" id="status-label">Offline</span>
    </div>
    <button class="btn-header" id="btn-code">Code</button>
    <button class="btn-header btn-primary" id="btn-deploy">Deploy</button>
  </div>
</header>

<!-- MAIN LAYOUT -->
<main class="studio" id="studio">
  <!-- CHAT PANEL (left) -->
  <aside class="chat-panel" id="chat-panel">
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" placeholder="Beschreibe was du bauen willst..." rows="1"></textarea>
      <button class="chat-send" id="chat-send">&#x27A4;</button>
    </div>
  </aside>

  <!-- CANVAS (right) -->
  <div class="canvas-wrap">
    <div class="canvas-loader hidden" id="canvas-loader"><div class="spinner"></div><span>Generiere...</span></div>
    <div class="canvas-empty" id="canvas-empty">
      <div class="empty-icon">&#x2B21;</div>
      <p>Beschreibe im Chat was du bauen willst.</p>
      <p class="empty-sub">Das Ergebnis erscheint hier als Live-Vorschau.</p>
    </div>
    <iframe id="canvas" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <!-- PROPERTIES (slide-in from right) -->
  <aside class="properties hidden" id="properties"></aside>
</main>

<!-- STATUS BAR -->
<div class="status-bar" id="status-bar">
  <span id="status-scaffold">Kein Projekt</span>
  <span class="status-sep">|</span>
  <span id="status-theme">dashboard</span>
  <span class="status-sep">|</span>
  <span id="status-sources">0 Datenquellen</span>
  <span class="status-sep">|</span>
  <span id="status-elements">0 Elemente</span>
</div>

<!-- CODE DRAWER -->
<div class="code-drawer hidden" id="code-drawer">
  <div class="drawer-header">
    <div class="drawer-tabs" id="drawer-tabs">
      <button class="drawer-tab active" data-tab="html">index.html</button>
      <button class="drawer-tab" data-tab="config">config.json</button>
      <button class="drawer-tab" data-tab="css">style.css</button>
      <button class="drawer-tab" data-tab="workflow">run.yml</button>
    </div>
    <div class="drawer-actions">
      <button class="btn-copy" id="btn-copy">Kopieren</button>
      <button class="btn-close-drawer" id="btn-close-drawer">&times;</button>
    </div>
  </div>
  <div class="drawer-body">
    <pre class="drawer-code" id="drawer-code"></pre>
  </div>
</div>

<script src="sample-data.js"></script>
<script src="builder.js"></script>
</body>
</html>
