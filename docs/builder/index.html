<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nano-zyrkel Project Studio</title>
  <meta name="description" content="Baue autonome Agenten visuell — Datenquellen, Bedingungen, Benachrichtigungen zusammenstecken.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span class="header-mark">&#x2B21;</span>
    <span class="header-title">nano-zyrkel</span>
    <span class="header-tag">project studio</span>
  </div>
  <div class="header-right">
    <div class="zyrkel-status" id="zyrkel-status" title="Zyrkel nicht verbunden">
      <span class="status-dot offline"></span>
      <span class="status-label" id="status-label">Offline</span>
    </div>
    <button class="btn-header" id="btn-code" title="Generierten Code anzeigen">Code anzeigen</button>
    <button class="btn-header btn-primary hidden" id="btn-deploy" title="Direkt deployen">Jetzt deployen</button>
  </div>
</header>

<!-- STUDIO (2 columns) -->
<main class="studio">

  <!-- LEFT: Baukasten -->
  <aside class="baukasten" id="baukasten">
    <div class="bk-dropdown-wrap" id="bk-dropdown-wrap">
      <button class="bk-dropdown-btn" id="bk-dropdown-btn">
        <span class="bk-dropdown-icon" id="bk-dropdown-icon"></span>
        <span class="bk-dropdown-text" id="bk-dropdown-text"></span>
        <span class="bk-dropdown-count" id="bk-dropdown-count"></span>
        <span class="bk-dropdown-arrow">&#9662;</span>
      </button>
      <div class="bk-dropdown-list hidden" id="bk-dropdown-list">
        <!-- Filled by JS -->
      </div>
    </div>
    <div class="baukasten-search">
      <input type="text" id="search-input" placeholder="Bausteine suchen..." autocomplete="off" spellcheck="false">
    </div>
    <div class="baukasten-grid" id="baukasten-grid">
      <!-- Filled by JS: visual cards for the active category -->
    </div>
  </aside>

  <!-- RIGHT: Live Product Preview -->
  <section class="vorschau" id="vorschau">
    <div id="preview-canvas" class="preview-canvas"></div>
  </section>

</main>

<!-- CODE DRAWER -->
<div class="code-drawer" id="code-drawer">
  <div class="drawer-header">
    <div class="drawer-tabs">
      <button class="drawer-tab active" data-tab="config">config.json</button>
      <button class="drawer-tab" data-tab="workflow">run.yml</button>
      <button class="drawer-tab" data-tab="readme">README.md</button>
    </div>
    <div class="drawer-actions">
      <button class="btn-copy" id="btn-copy" title="Kopieren">Kopieren</button>
      <button class="btn-close-drawer" id="btn-close-drawer" title="Schliessen">&times;</button>
    </div>
  </div>
  <div class="drawer-body">
    <pre class="drawer-code" id="drawer-code"></pre>
  </div>
  <div class="drawer-footer" id="drawer-footer">
    <h4>Naechste Schritte</h4>
    <ol id="next-steps"></ol>
  </div>
</div>

<!-- LLM CHAT FAB -->
<button class="chat-fab" id="chat-fab" title="KI-Assistent">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
  </svg>
</button>
<div class="chat-overlay hidden" id="chat-overlay">
  <div class="chat-header">
    <span>KI-Assistent</span>
    <button class="chat-close" id="chat-close">&times;</button>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-input-row">
    <input type="text" id="chat-input" placeholder="Beschreibe was du bauen willst..." autocomplete="off">
    <button class="chat-send" id="chat-send">&#x27A4;</button>
  </div>
</div>

<script src="builder.js"></script>
</body>
</html>
