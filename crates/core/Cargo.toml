[package]
name = "nano-zyrkel-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "nano-zyrkel core library — config, fetchers, conditions, actions, notifiers, runtime"

[lib]
name = "nano_zyrkel_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
scraper = { workspace = true }
url = { workspace = true }
jsonpath-rust = { workspace = true }
lettre = { workspace = true }
imap = { workspace = true }
native-tls = { workspace = true }
base64 = { workspace = true }
mailparse = { workspace = true }
quick-xml = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
rhai-scripting = ["dep:rhai"]
browser = ["dep:headless_chrome"]

[dependencies.rhai]
version = "1"
optional = true

[dependencies.headless_chrome]
version = "1"
optional = true
