[package]
name = "nano-zyrkel-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Core library for the nano-zyrkel SDK: typed config, fetchers, conditions, actions, notifiers and runtime for GitHub-native autonomous agents."
documentation = "https://docs.rs/nano-zyrkel-core"
readme = "../../README.md"
keywords = ["agent", "automation", "scheduler", "github-actions", "sdk"]
categories = ["command-line-utilities", "web-programming::http-client", "asynchronous"]

[lib]
name = "nano_zyrkel_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
scraper = { workspace = true }
url = { workspace = true }
jsonpath-rust = { workspace = true }
lettre = { workspace = true }
imap = { workspace = true }
native-tls = { workspace = true }
base64 = { workspace = true }
mailparse = { workspace = true }
quick-xml = { workspace = true }
jsonschema = { workspace = true }

[features]
default = []
rhai-scripting = ["dep:rhai"]
browser = ["dep:headless_chrome"]

[dependencies.rhai]
version = "1"
optional = true

[dependencies.headless_chrome]
version = "1"
optional = true
