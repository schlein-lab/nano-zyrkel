[package]
name = "nano-zyrkel-wasm-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Browser-side core for the nano-zyrkel SDK: data loaders, charting primitives, UI components and i18n compiled to WebAssembly."
documentation = "https://docs.rs/nano-zyrkel-wasm-core"
readme = "../../README.md"
keywords = ["wasm", "webassembly", "charts", "dataviz", "sdk"]
categories = ["wasm", "web-programming", "visualization"]

[lib]
name = "nano_zyrkel_wasm_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# Default keeps the WASM bundle small: just the data layer.
# User repos opt into visualization layers via features.
default = ["data", "config"]

# ── Data layer ──
# DataLoader, Filter, Aggregator, Stats, Search, Diff, Cache, Retry
data = []

# ── Config + i18n ──
# ConfigReader, I18n
config = []

# ── Visualization: foundation + basic charts ──
# CanvasSetup, Scale, Axis, ColorPalette, Format,
# LineChart, BarChart, Donut, Tooltip
viz-basic = ["data"]

# ── Visualization: extended chart types ──
# ScatterPlot, Histogram, Heatmap, SortedBar, Legend, EmptyState
viz-advanced = ["viz-basic"]

# ── Visualization: spatial / map / graph primitives ──
# LinearTrack, NetworkGraph, WorldMap
viz-spatial = ["viz-basic"]

# ── Visualization: interactive UI components ──
# Toast, Modal, Tabs, Accordion, Icons, FormControls, SortableList,
# Markdown renderer, Animation tweens.
viz-ui = ["viz-basic", "dep:pulldown-cmark"]

# ── Convenience meta-feature ──
all = ["viz-spatial", "viz-advanced", "viz-ui", "config"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"], optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlOptionElement",
    "HtmlButtonElement",
    "HtmlAnchorElement",
    "HtmlIFrameElement",
    "InputEvent",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "DragEvent",
    "DataTransfer",
    "Location",
    "History",
    "Url",
    "UrlSearchParams",
    "PopStateEvent",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "Blob",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CssStyleDeclaration",
    "DomRect",
    "DomTokenList",
    "Text",
    "Node",
    "NodeList",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Storage",
    "console",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-mutable-globals",
    "--enable-sign-ext",
]
