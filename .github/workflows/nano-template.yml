# nano-zyrkel Workflow Template
# Copy this file and adjust: name, cron, config path
name: "nano-zyrkel: {BESCHREIBUNG}"

on:
  schedule:
    - cron: '*/30 * * * *'   # Alle 30 Minuten — anpassen!
  workflow_dispatch:           # Manueller Trigger moeglich

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get nano-zyrkel
        run: |
          curl -sL "https://github.com/christian-schlein/nano-zyrkel/releases/latest/download/nano-zyrkel-linux" \
            -o nano-zyrkel && chmod +x nano-zyrkel

      - name: Execute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ./nano-zyrkel --config hats/{CONFIG_NAME}.json --lang de

      - name: Commit results
        run: |
          git config user.name "nano-zyrkel"
          git config user.email "nano@zyrkel.local"
          git add staging/ hats/
          git diff --staged --quiet || \
            git commit -m "nano: {NANO_ID} $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
