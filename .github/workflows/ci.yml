# Continuous integration for the nano-zyrkel SDK.
#
# Builds both cores, runs the test suite, and lints with clippy on every
# push and pull request. Backs the "ci" status badge in the README.
#
# Heavy work (cross-compiled release artifacts, WASM bundles for every
# feature, crates.io publishing, GitHub Pages deploy) lives in dedicated
# workflows so this one stays under five minutes.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "templates/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "templates/**"
      - "**.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-${{ matrix.os }}-
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
      - name: clippy
        run: cargo clippy --workspace --all-targets
