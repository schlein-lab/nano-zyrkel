name: Release WASM Core

# Triggered by pushing a tag like `wasm-v0.1.0`. Builds the WASM bundle for
# every supported feature combination, packs them into a single zip and
# attaches the result to a GitHub Release. User repos can then pull the
# matching bundle via the update-core reusable workflow.

on:
  push:
    tags:
      - "wasm-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (wasm-vX.Y.Z)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build WASM (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: data
            features: "data,config"
          - profile: viz-basic
            features: "data,config,viz-basic"
          - profile: viz-advanced
            features: "data,config,viz-basic,viz-advanced"
          - profile: all
            features: "data,config,viz-basic,viz-advanced,viz-spatial"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM bundle
        run: |
          cd crates/wasm-core
          wasm-pack build \
            --release \
            --target web \
            --out-dir ../../dist/wasm/${{ matrix.profile }} \
            --no-default-features \
            --features ${{ matrix.features }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.profile }}
          path: dist/wasm/${{ matrix.profile }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack feature bundles
        run: |
          mkdir -p release
          for dir in artifacts/wasm-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../release/${name}.zip" .)
          done
          ls -la release/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release/*.zip
