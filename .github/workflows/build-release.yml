name: Build & Release nano-zyrkel

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Create checksum
        run: |
          cd target/x86_64-unknown-linux-musl/release
          sha256sum nano-zyrkel > nano-zyrkel-linux.sha256
          cp nano-zyrkel nano-zyrkel-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nano-zyrkel-linux
          path: |
            target/x86_64-unknown-linux-musl/release/nano-zyrkel-linux
            target/x86_64-unknown-linux-musl/release/nano-zyrkel-linux.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/nano-zyrkel-linux
            target/x86_64-unknown-linux-musl/release/nano-zyrkel-linux.sha256
