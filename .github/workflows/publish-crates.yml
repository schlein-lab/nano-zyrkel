# Publish the SDK crates to crates.io.
#
# Triggered manually so we keep tight control over what version lands on the
# registry. The job publishes in dependency order:
#
#   1. nano-zyrkel-core      (the library every consumer pulls in)
#   2. nano-zyrkel           (the CLI binary, depends on nano-zyrkel-core)
#   3. nano-zyrkel-wasm-core (the browser-side counterpart)
#
# Required secret: CARGO_REGISTRY_TOKEN
#   → https://crates.io/me  →  "API tokens"  →  scope: publish-update

name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: publish-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Verify nano-zyrkel-core
        run: cargo publish -p nano-zyrkel-core --dry-run --allow-dirty

      - name: Publish nano-zyrkel-core
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nano-zyrkel-core

      - name: Wait for crates.io index
        if: inputs.dry_run == false
        run: sleep 45

      - name: Verify nano-zyrkel CLI
        run: cargo publish -p nano-zyrkel --dry-run --allow-dirty

      - name: Publish nano-zyrkel CLI
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nano-zyrkel

      - name: Wait for crates.io index
        if: inputs.dry_run == false
        run: sleep 45

      - name: Verify nano-zyrkel-wasm-core
        run: cargo publish -p nano-zyrkel-wasm-core --dry-run --allow-dirty

      - name: Publish nano-zyrkel-wasm-core
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nano-zyrkel-wasm-core
